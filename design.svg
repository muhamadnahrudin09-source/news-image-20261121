<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <style>
    .paper-bg { fill: #f6f1e7; }
    .masthead-title { font-family: 'Georgia', 'Times New Roman', serif; font-size: 80px; font-weight: bold; fill: #111111; letter-spacing: 2px; text-anchor: middle; }
    .masthead-sub { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 13px; font-weight: bold; fill: #333333; letter-spacing: 3px; text-anchor: middle; text-transform: uppercase; }
    .lead-headline { font-family: 'Georgia', 'Times New Roman', serif; font-size: 34px; font-weight: bold; fill: #111111; letter-spacing: -0.5px; }
    .lead-subline { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 16px; fill: #333333; line-height: 1.4; }
    .story-headline { font-family: 'Georgia', 'Times New Roman', serif; font-size: 16px; font-weight: bold; fill: #111111; }
    .story-desc { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 13px; fill: #444444; }
    .footer-text { font-family: 'Georgia', 'Times New Roman', serif; font-size: 14px; font-style: italic; fill: #555555; text-anchor: middle; }
    .rule-dark { stroke: #111111; stroke-width: 2px; }
    .rule-light { stroke: #cccccc; stroke-width: 1px; }
    .accent-red { fill: #c8102e; }
    .stroke-red { stroke: #c8102e; stroke-width: 3px; fill: none; }
  </style>

  <!-- Paper background -->
  <rect width="1024" height="1024" class="paper-bg"/>

  <!-- Outer border / margins -->
  <rect x="36" y="36" width="952" height="952" fill="none" stroke="#111111" stroke-width="4"/>
  <rect x="42" y="42" width="940" height="940" fill="none" stroke="#111111" stroke-width="1"/>

  <!-- MASTHEAD -->
  <line x1="52" y1="58" x2="972" y2="58" class="rule-dark"/>
  <line x1="52" y1="64" x2="972" y2="64" class="rule-light"/>
  
  <text x="512" y="130" class="masthead-title">THE WORLD</text>
  
  <!-- Thin double rule beneath masthead title -->
  <line x1="52" y1="146" x2="972" y2="146" class="rule-light"/>
  <line x1="52" y1="150" x2="972" y2="150" class="rule-light"/>

  <text x="512" y="170" class="masthead-sub">Friday, 20 November 2026 &amp;middot; World News in One Page</text>
  <line x1="52" y1="182" x2="972" y2="182" class="rule-dark"/>

  <!-- LEAD ART & STORY (Top ~45%, y: 190 to 555) -->
  <g transform="translate(52, 195)">
    <!-- Illustration Box -->
    <rect x="0" y="0" width="920" height="210" fill="#eae3d2" stroke="#111111" stroke-width="1.5"/>
    
    <!-- Stylized Map / Graphic Scene inside Art Box -->
    <!-- Poland Map Silhouette placeholder polygon -->
    <g transform="translate(60, 20)">
      <path d="M50,30 L130,20 L180,60 L160,130 L100,160 L40,120 L20,70 Z" fill="#d3cbba" stroke="#555" stroke-width="1.5"/>
      <!-- NATO Flag Block -->
      <rect x="110" y="70" width="28" height="20" fill="#003399" stroke="#111" stroke-width="1"/>
      <circle cx="124" cy="80" r="6" fill="#ffcc00"/>
      <text x="124" y="105" font-family="Arial" font-size="10" font-weight="bold" fill="#333" text-anchor="middle">NATO SOIL</text>
      
      <!-- Missile Streak in Red -->
      <path d="M-20,160 Q60,110 115,75" class="stroke-red" stroke-dasharray="6,4"/>
      <polygon points="115,75 105,72 108,82" fill="#c8102e"/>
      <circle cx="115" cy="75" r="8" fill="#c8102e" opacity="0.4"/>
      
      <!-- Radar Arcs -->
      <path d="M 115,75 m -35,0 a 35,35 0 0,1 70,0" stroke="#c8102e" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M 115,75 m -60,0 a 60,60 0 0,1 120,0" stroke="#c8102e" stroke-width="1" fill="none" opacity="0.3"/>
    </g>

    <!-- Burning City Skyline (Kyiv) -->
    <g transform="translate(560, 30)">
      <rect x="0" y="80" width="280" height="90" fill="#333333"/>
      <!-- Buildings -->
      <rect x="20" y="30" width="30" height="140" fill="#222"/>
      <rect x="60" y="10" width="45" height="160" fill="#2a2a2a"/>
      <rect x="115" y="50" width="35" height="120" fill="#1c1c1c"/>
      <rect x="160" y="20" width="50" height="150" fill="#262626"/>
      <rect x="220" y="45" width="40" height="125" fill="#222"/>
      
      <!-- Flames / Smoke -->
      <path d="M 70,10 Q 82,-15 75,-30 Q 95,-10 85,10" fill="#c8102e"/>
      <path d="M 175,20 Q 185,-5 180,-20 Q 200,0 190,20" fill="#ff6600"/>
      <text x="140" y="155" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="2px" text-anchor="middle">KYIV STRIKES</text>
    </g>

    <!-- Red Accent Tag -->
    <rect x="0" y="0" width="140" height="24" fill="#c8102e"/>
    <text x="70" y="16" font-family="Arial" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1.5px" text-anchor="middle">BREAKING REPORT</text>
  </g>

  <!-- Lead Headline & Subline -->
  <g transform="translate(52, 435)">
    <text x="0" y="0" class="lead-headline">RUSSIAN MISSILES HIT NATO SOIL IN POLAND</text>
    <text x="0" y="26" class="lead-subline">NATO calls it a violation; overnight strikes on Kyiv kill 3, cut power supplies.</text>
  </g>

  <line x1="52" y1="485" x2="972" y2="485" class="rule-dark"/>

  <!-- 2-COLUMN GRID OF 6 SHORT STORIES (y: 500 to 935) -->
  <!-- Column 1: x = 52 to 492 (width 440) -->
  <!-- Column 2: x = 532 to 972 (width 440) -->

  <!-- Story 1 (Col 1, Top) -->
  <g transform="translate(52, 505)">
    <rect x="0" y="0" width="16" height="16" class="accent-red"/>
    <text x="26" y="13" class="story-headline">TRUMP TOUTS SUMMIT, EYES KIM MEETING</text>
    <text x="0" y="38" class="story-desc">Post-summit press conference in Washington highlights diplomatic pivot.</text>
    <line x1="0" y1="55" x2="440" y2="55" class="rule-light"/>
  </g>

  <!-- Story 2 (Col 2, Top) -->
  <g transform="translate(532, 505)">
    <rect x="0" y="0" width="16" height="16" class="accent-red"/>
    <text x="26" y="13" class="story-headline">ANTHROPIC IPO: BIGGEST EVER</text>
    <text x="0" y="38" class="story-desc">AI lab surges in record market debut as valuation shatters records.</text>
    <line x1="0" y1="55" x2="440" y2="55" class="rule-light"/>
  </g>

  <!-- Story 3 (Col 1, Mid) -->
  <g transform="translate(52, 580)">
    <rect x="0" y="0" width="16" height="16" class="accent-red"/>
    <text x="26" y="13" class="story-headline">UK AND EU HOLD RARE SUMMIT</text>
    <text x="0" y="38" class="story-desc">Burnham seeks to mend Brexit damage through renewed bilateral pacts.</text>
    <line x1="0" y1="55" x2="440" y2="55" class="rule-light"/>
  </g>

  <!-- Story 4 (Col 2, Mid) -->
  <g transform="translate(532, 580)">
    <rect x="0" y="0" width="16" height="16" class="accent-red"/>
    <text x="26" y="13" class="story-headline">ICJ: MYANMAR GUILTY OF GENOCIDE</text>
    <text x="0" y="38" class="story-desc">Rohingya ruling delivers historic condemnation; immediate sanctions urged.</text>
    <line x1="0" y1="55" x2="440" y2="55" class="rule-light"/>
  </g>

  <!-- Story 5 (Col 1, Low) -->
  <g transform="translate(52, 655)">
    <rect x="0" y="0" width="16" height="16" class="accent-red"/>
    <text x="26" y="13" class="story-headline">COP STALLED ON FOSSIL FUELS</text>
    <text x="0" y="38" class="story-desc">No phaseout deal reached in Turkiye; climate finance gaps remain wide.</text>
    <line x1="0" y1="55" x2="440" y2="55" class="rule-light"/>
  </g>

  <!-- Story 6 (Col 2, Low) -->
  <g transform="translate(532, 655)">
    <rect x="0" y="0" width="16" height="16" class="accent-red"/>
    <text x="26" y="13" class="story-headline">FIONA THE HIPPO DIES AT 9</text>
    <text x="0" y="38" class="story-desc">Cincinnati Zoo icon mourned globally after swallowing visitor-dropped hat.</text>
    <line x1="0" y1="55" x2="440" y2="55" class="rule-light"/>
  </g>

  <!-- Additional Briefs section / Extra editorial filler block to fill layout nicely -->
  <g transform="translate(52, 735)">
    <rect x="0" y="0" width="920" height="175" fill="#f0eae1" stroke="#cccccc" stroke-width="1"/>
    <text x="20" y="25" font-family="Georgia" font-size="14" font-weight="bold" fill="#111" letter-spacing="1px">WORLD ROUNDUP: MARKETS &amp; DIPLOMACY</text>
    <line x1="20" y1="35" x2="900" y2="35" class="rule-dark"/>
    
    <g transform="translate(20, 50)">
      <text x="0" y="0" font-family="Arial" font-size="12" font-weight="bold" fill="#111">• Nvidia Inquiry:</text>
      <text x="135" y="0" font-family="Arial" font-size="12" fill="#333">Stock extends $2.5T rout amid federal accounting probe.</text>
      
      <text x="0" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="#111">• FBI Breach:</text>
      <text x="135" y="30" font-family="Arial" font-size="12" fill="#333">Second major cyber intrusion reported this calendar year.</text>

      <text x="0" y="60" font-family="Arial" font-size="12" font-weight="bold" fill="#111">• GTA 6 Sales:</text>
      <text x="135" y="60" font-family="Arial" font-size="12" fill="#333">Industry estimates cross $2.3 billion worldwide in launch week.</text>

      <text x="0" y="90" font-family="Arial" font-size="12" font-weight="bold" fill="#111">• Robot Accord:</text>
      <text x="135" y="90" font-family="Arial" font-size="12" fill="#333">UN states agree to talks aiming for strict regulation by 2028.</text>
    </g>
  </g>

  <!-- FOOTER STRIP -->
  <line x1="52" y1="945" x2="972" y2="945" class="rule-dark"/>
  <line x1="52" y1="951" x2="972" y2="951" class="rule-light"/>
  <text x="512" y="970" class="footer-text">One page. One day. 21.11.2026</text>
  <line x1="52" y1="985" x2="972" y2="985" class="rule-dark"/>
</svg>
